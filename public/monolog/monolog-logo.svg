<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
<title>Monolog official logo</title>
<desc>White keyboard key with three evenly spaced diagonal diary-page layers; borders remain visible along the right edge, around the bottom-right corner and across the bottom. Exact Beth Ellen lowercase m, left aligned and vertically centered.</desc>
<defs>
  <linearGradient id="cover" x1="192" y1="221" x2="838" y2="872" gradientUnits="userSpaceOnUse">
    <stop stop-color="#D5DAE7"/><stop offset="1" stop-color="#A4ADBF"/>
  </linearGradient>
  <linearGradient id="paper" x1="158" y1="250" x2="838" y2="818" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/><stop offset="0.67" stop-color="#F0F2F8"/><stop offset="1" stop-color="#D9DFEB"/>
  </linearGradient>
  <linearGradient id="key" x1="235" y1="133" x2="743" y2="774" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/><stop offset="0.58" stop-color="#F8F9FD"/><stop offset="1" stop-color="#EBEEF6"/>
  </linearGradient>
  <linearGradient id="key-edge" x1="128" y1="124" x2="848" y2="794" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#ECEFF7"/><stop offset="1" stop-color="#B9C2D4"/>
  </linearGradient>
  <filter id="shadow" x="66" y="84" width="892" height="884" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
</defs>
